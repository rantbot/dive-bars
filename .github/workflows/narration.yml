# Records the film's narration with ElevenLabs whenever narration/clips.json changes on main.
# Only lines whose words changed are recorded. The new MP3s are committed back to the repo.
# One-time setup: Settings, Secrets and variables, Actions, New repository secret, named ELEVEN_API_KEY.
name: Record narration
on:
  push:
    branches: [main]
    paths: ['narration/clips.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: narration
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record changed lines
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
        run: python3 narration/generate.py
      - name: Commit the recordings
        run: |
          git config user.name "Narration bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snd/film narration/recorded.json narration/clips.json
          if git diff --cached --quiet; then echo "Nothing new to record."; exit 0; fi
          git commit -m "Record narration"
          git pull --rebase origin main
          git push
